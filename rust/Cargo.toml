[package]
name = "tailslayer"
version = "0.1.0"
edition = "2021"
authors = ["AOMaker Team"]
description = "Tailslayer: Sub-Microsecond DRAM Refresh Latency Mitigation Engine in Rust"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
